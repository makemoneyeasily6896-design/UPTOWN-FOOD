<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Checkout | UPTOWN FOOD</title><link rel="stylesheet" href="style.css"></head>
<body>
<header class="site-header"><a class="logo" href="index.html">UPTOWN <span>FOOD</span></a><nav><a href="menu.html">Menu</a><a href="cart.html">Cart <b id="cartCount">0</b></a></nav></header>
<main><section class="page-hero"><p class="eyebrow">CHECKOUT</p><h1>Complete your order.</h1></section>
<section class="section checkout-layout">
<form id="orderForm" class="form-card">
<label>Full name<input required name="name" placeholder="Your name"></label>
<label>Phone number<input required name="phone" placeholder="024 000 0000"></label>
<label>Order type<select name="type"><option>Delivery</option><option>Pickup</option></select></label>
<label>Delivery address<textarea name="address" placeholder="House number, street, area"></textarea></label>
<label>Notes<textarea name="notes" placeholder="Optional instructions"></textarea></label>
<button class="btn full" type="submit">Place Order</button>
<p class="small">This free version sends the order to WhatsApp. You can add online payments later.</p>
</form>
<aside class="summary"><h2>Order summary</h2><div id="checkoutSummary"></div><hr><div class="sum-row total"><span>Total</span><strong id="checkoutTotal">GH₵0</strong></div></aside>
</section></main>
<footer><strong>UPTOWN FOOD</strong><p>Fresh meals • Ghana</p></footer><script src="script.js"></script></body></html>
